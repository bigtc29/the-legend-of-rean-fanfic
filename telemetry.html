<body class="bg-obsidian text-ivory antialiased min-h-screen flex flex-col font-cormorant selection:bg-muted-gold/30 selection:text-ivory">
    
<!-- Minimalist Header -->

            <p class="font-sarabun italic text-lg text-ivory/60">ศูนย์ตรวจวัดสภาวะจักรวาลและข่าวกรองสด (Mockup)</p>
        </div>

        <div class="flex items-center justify-between mb-6 pb-2 border-b border-muted-gold/20">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-inter uppercase tracking-widest text-muted-gold/70">SELECT SCENE:</span>
                <select id="mock-scene-selector" onchange="loadTelemetry(this.value)" class="bg-obsidian border border-muted-gold/40 text-ivory text-sm py-1 px-2 font-inter focus:outline-none focus:border-muted-gold">
                    <option value="vol1_prologue_scene01">Prologue: Scene 01 (เช้า)</option>
                    <option value="vol1_prologue_scene02">Prologue: Scene 02 (บ่าย)</option>

            <div class="text-xs font-inter text-emerald-400/80 uppercase tracking-widest flex items-center">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-2"></span>
                Live Link
            </div>
        </div>

        <div id="telemetry-content" class="grid grid-cols-1 lg:grid-cols-2 gap-6 opacity-0 transition-opacity duration-500">
            <!-- Loading State handled by JS -->
        </div>
    </div>
</main>

              "08:30 - ขบวนรถไฟหุ้มเกราะสายพิเศษเดินทางออกจาก Heimdallr มุ่งหน้า Trista",
              "09:15 - ยืนยันการสั่งซื้อรถตู้ VIP Denza D9 จำนวน 5 คันเข้าประจำการในคฤหาสน์ชวาเซอร์"
            ]

        "vol1_prologue_scene02": {

          },
          "tension": {

            "level_text": "ELEVATED",
            "noble_status": "ดยุคไคเอนจัดงานเลี้ยงรวมพลลับๆ ใน Ordis",
            "reformist_status": "หน่วยข่าวกรอง RMP ตรวจสอบเส้นทางการเงินกลุ่มทุนปริศนา",
            "guard_status": "เพิ่มมาตรการ รปภ. ระดับ 5 รอบตึก Burj-Orbal"
          },
          "social": {

              { "user": "@CrossbellTrader", "time": "2 นาทีที่แล้ว", "content": "ใครพอจะรู้บ้างว่าดีล 3 แสนล้านที่เพิ่งเซ็นกันมันคืออะไร!? กราฟพุ่งแปลกๆ 📈", "likes": "45.2K" },
              { "user": "@Tourist_099", "time": "1 ชั่วโมงที่แล้ว", "content": "เพิ่งได้ขึ้นลิฟต์แก้วของ Ymir Dubai สวยจนน้ำตาไหล 😭✨ #BurjOrbal", "likes": "120K" }
            ],
            "wire_headline": "🟡 [รายงาน] การเคลื่อนไหวของกองทุน IBC ในพื้นที่ Ymir",
            "wire_reports": [
              "13:00 - ประธาน IBC เดินทางถึง Ymir Dubai อย่างเป็นทางการ",
              "13:45 - พบการโอนเซปเทียมเหลวมูลค่ามหาศาลผ่านเครือข่าย Orbal Network",
              "14:30 - ตลาดหลักทรัพย์ปรับตัวตอบรับกระแสข่าวการลงทุนใหม่"
            ]
          }
        }
    };

    function loadTelemetry(sceneId) {
        const container = document.getElementById('telemetry-content');
        container.style.opacity = 0;
        
        setTimeout(() => {
            const data = MOCK_DATA[sceneId];
            if (data) {
                renderTelemetry(data);
                container.style.opacity = 1;
            } else {
                container.innerHTML = `<div class="col-span-2 text-center text-red-400 py-10 font-inter">Failed to load telemetry data for ${sceneId}.</div>`;
                container.style.opacity = 1;
            }
        }, 300);
    }

    function renderTelemetry(data) {
        const container = document.getElementById('telemetry-content');
        
        let html = '';
        
        // --- MACRO STATE ---
        if (data.macro) {
            html += `
            <div class="col-span-1 lg:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4 mb-2">
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-regular fa-clock mr-1"></i> World Clock</div>
                    <div class="font-sarabun text-ivory text-sm">${data.macro.world_clock}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-location-dot mr-1"></i> Active Sector</div>
                    <div class="font-sarabun text-cyan-200/90 text-sm">${data.macro.active_sector}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-coins mr-1"></i> Clan Vault</div>
                    <div class="font-sarabun text-muted-gold text-sm">${data.macro.clan_vault}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-bolt mr-1"></i> Rean Spec / PSI</div>
                    <div class="font-sarabun text-amber-200/90 text-sm">${data.macro.rean_spec}</div>
                </div>
            </div>`;
        }

        // --- ECONOMY ---
        if (data.economy) {
            html += `
            <div class="border border-muted-gold/20 bg-obsidian p-6 relative shadow-lg">
                <div class="absolute top-0 left-0 w-8 h-8 border-t border-l border-muted-gold/40"></div>
                <h2 class="font-cinzel text-xl text-muted-gold mb-5 border-b border-white/10 pb-2"><i class="fa-solid fa-chart-line mr-2 text-emerald-400"></i>Capital & Energy</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-white/5 p-3 rounded border border-white/5">
                        <div class="text-[10px] font-inter uppercase text-ivory/40">🛢️ Liquid Septium</div>
                        <div class="font-sarabun font-bold text-2xl text-cyan-300">${data.economy.septium_price.value}</div>
                        <div class="text-[10px] font-inter ${data.economy.septium_price.up ? 'text-emerald-400' : 'text-red-400'}"><i class="fa-solid ${data.economy.septium_price.up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'}"></i> ${data.economy.septium_price.trend} ${data.economy.septium_price.status}</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded border border-white/5">
                        <div class="text-[10px] font-inter uppercase text-ivory/40">🏢 Reinford (RF) Stock</div>
                        <div class="font-sarabun font-bold text-2xl text-amber-300">${data.economy.rf_stock.value}</div>
                        <div class="text-[10px] font-inter ${data.economy.rf_stock.up ? 'text-emerald-400' : 'text-red-400'}"><i class="fa-solid ${data.economy.rf_stock.up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'}"></i> ${data.economy.rf_stock.trend} ${data.economy.rf_stock.status}</div>
                    </div>
                </div>
                <div class="space-y-3 font-sarabun text-ivory/80 text-sm border-t border-white/10 pt-4">
                    <div class="flex justify-between items-center"><span class="text-ivory/50"><i class="fa-solid fa-mountain-sun mr-1"></i> Land Price:</span> <span>${data.economy.land_price.value} <span class="text-xs text-amber-200/70 ml-1">(${data.economy.land_price.status})</span></span></div>
                    <div class="flex justify-between items-center"><span class="text-ivory/50"><i class="fa-solid fa-wallet mr-1"></i> Cash Flow:</span> <span class="text-emerald-400 font-bold">${data.economy.cash_flow.value} <span class="text-xs text-emerald-300/70 ml-1 font-normal">(${data.economy.cash_flow.status})</span></span></div>
                    <div class="mt-4 p-3 bg-white/5 border border-muted-gold/20 rounded-sm">
                        <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-2">📜 Active Deals</div>
                        <div class="italic text-amber-100/90 leading-relaxed font-sarabun text-xs">${data.economy.active_deal}</div>
                    </div>
                </div>
            </div>`;
        }

        // --- TENSION ---
        if (data.tension) {
            let tensionColor = 'bg-emerald-500';
            if (data.tension.index_percent > 30) tensionColor = 'bg-amber-500';
            if (data.tension.index_percent > 70) tensionColor = 'bg-red-500';

            html += `
            <div class="border border-muted-gold/20 bg-obsidian p-6 relative shadow-lg">
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-muted-gold/40"></div>
                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-5">
                    <h2 class="font-cinzel text-xl text-muted-gold"><i class="fa-solid fa-shield-halved mr-2 text-red-400"></i>Tension Radar</h2>
                    <span class="text-[10px] font-inter uppercase px-2 py-1 bg-amber-950/80 text-amber-300 border border-amber-500/30 rounded">${data.tension.level_text}</span>
                </div>
                
                <div class="mb-6 bg-white/5 p-4 rounded border border-white/5">
                    <div class="flex justify-between text-[11px] font-inter text-ivory/60 mb-2">
                        <span class="uppercase">Imperial Tension Index</span>
                        <span class="text-amber-300 font-bold">${data.tension.index_percent}%</span>
                    </div>
                    <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden border border-white/10">
                        <div class="h-full ${tensionColor} transition-all duration-1000 shadow-[0_0_10px_currentColor]" style="width: ${data.tension.index_percent}%"></div>
                    </div>
                </div>

                <div class="space-y-3 font-sarabun text-[13px]">
                    <div class="p-3 border-l-2 border-amber-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-amber-500/80 mb-1 flex items-center"><i class="fa-solid fa-crown mr-1"></i> Noble Alliance</div>
                        <div class="text-ivory/80">${data.tension.noble_status}</div>
                    </div>
                    <div class="p-3 border-l-2 border-cyan-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-cyan-500/80 mb-1 flex items-center"><i class="fa-solid fa-building-columns mr-1"></i> Reformist Faction</div>
                        <div class="text-ivory/80">${data.tension.reformist_status}</div>
                    </div>
                    <div class="p-3 border-l-2 border-emerald-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-emerald-500/80 mb-1 flex items-center"><i class="fa-solid fa-shield-virus mr-1"></i> Ymir Royal Guard</div>
                        <div class="text-ivory/80">${data.tension.guard_status}</div>
                    </div>
                </div>
            </div>`;
        }

        // --- SOCIAL & WIRE ---
        if (data.social) {
            html += `
            <div class="col-span-1 lg:col-span-2 border border-muted-gold/20 bg-obsidian p-6 mt-2 relative shadow-lg">
                <h2 class="font-cinzel text-xl text-muted-gold mb-5 border-b border-white/10 pb-2"><i class="fa-solid fa-hashtag mr-2 text-cyan-400"></i>ARC-Net & Intelligence</h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <div class="text-[10px] font-inter uppercase text-ivory/40 mb-3 tracking-widest"><i class="fa-solid fa-fire mr-1 text-red-400"></i> Trending on ARC-Net</div>
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${data.social.trending_tags.map(t => `<span class="px-2 py-1 bg-[#1F2428] border border-cyan-500/30 text-cyan-300 text-xs font-inter rounded hover:border-cyan-400 cursor-pointer transition-colors shadow-sm">${t}</span>`).join('')}
                        </div>
                        <div class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                            ${data.social.posts.map(p => `
                            <div class="p-4 bg-[#0F1318] border border-cyan-900/30 hover:border-cyan-500/30 rounded-lg transition-colors">
                                <div class="flex justify-between items-center mb-2 border-b border-white/5 pb-2">
                                    <span class="font-inter font-bold text-[11px] text-cyan-300 flex items-center"><div class="w-5 h-5 rounded-full bg-cyan-950 flex items-center justify-center mr-2"><i class="fa-solid fa-user text-[8px]"></i></div> ${p.user} <i class="fa-solid fa-circle-check text-cyan-400 ml-1 text-[10px]"></i></span>
                                    <span class="font-inter text-[10px] text-slate-400">${p.time}</span>
                                </div>
                                <div class="font-sarabun text-sm text-ivory/90 mb-3 leading-relaxed">${p.content}</div>
                                <div class="font-inter text-[10px] text-slate-400 flex gap-4">
                                    <span class="cursor-pointer hover:text-red-400"><i class="fa-solid fa-heart text-slate-500 hover:text-red-500 mr-1"></i> ${p.likes}</span>
                                    <span class="cursor-pointer hover:text-cyan-400"><i class="fa-solid fa-retweet text-slate-500 mr-1"></i> RE-ARC</span>
                                </div>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div>
                        <div class="text-[10px] font-inter uppercase text-ivory/40 mb-3 tracking-widest"><i class="fa-solid fa-tower-cell mr-1 text-amber-400"></i> Wire Reports</div>
                        <div class="font-sarabun text-amber-100/90 text-sm mb-4 bg-[#14171A] p-3 border-l-2 border-amber-500 rounded-r-lg shadow-sm">
                            ${data.social.wire_headline}
                        </div>
                        <div class="space-y-2 font-sarabun text-ivory/70 text-sm bg-obsidian border border-white/5 rounded-lg p-2">
                            ${data.social.wire_reports.map(r => `
                            <div class="p-2 border-l-2 border-muted-gold/40 bg-white/5 mb-2 rounded-r flex items-start">
                                <i class="fa-solid fa-caret-right text-muted-gold/50 mr-2 mt-1 text-[10px]"></i>
                                <span class="font-sarabun text-xs leading-relaxed text-slate-300">${r}</span>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        container.innerHTML = html;
    }

    // Auto-load first scene
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sceneId = urlParams.get('scene') || 'vol1_prologue_scene01';
        document.getElementById('mock-scene-selector').value = sceneId;
        loadTelemetry(sceneId);
    });
</script>

    
    <script src="assets/js/main.js"></script>
</body>
</html>
