<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Stat | The Legend of Rean</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Cinzel:wght@400;600;700&family=Chonburi&family=Inter:wght@300;400;500;600&&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS (Now Compiled via Tailwind CLI) -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    
</head>
<body class="bg-obsidian text-ivory antialiased min-h-screen flex flex-col font-cormorant selection:bg-muted-gold/30 selection:text-ivory">
    
<!-- Minimalist Header -->
<header class="w-full border-b border-muted-gold/20 py-4 px-6 sticky top-0 bg-obsidian/95 backdrop-blur z-40 flex justify-between items-center">
    <div class="font-cinzel text-muted-gold/80 tracking-widest text-xs uppercase">
        <a href="index.html" class="hover:text-muted-gold transition-colors">🏛️ The Chronicles of Rean</a>
    </div>
    <div class="font-inter text-[10px] text-ivory/50 flex gap-4 uppercase tracking-widest">
        <a href="telemetry.html" class="text-muted-gold transition-colors"><i class="fa-solid fa-satellite-dish mr-1"></i> Universe Stat</a>
        <a href="dynamic_living.html" class="erebonian-link hover:text-muted-gold transition-colors"><i class="fa-solid fa-users mr-1"></i> Dynamic Living</a>
        <a href="archive.html" class="hover:text-muted-gold transition-colors"><i class="fa-solid fa-scroll mr-1"></i> Imperial Archive</a>
        <a href="toc.html" class="hover:text-muted-gold transition-colors"><i class="fa-solid fa-book mr-1"></i> Chapters</a>
    </div>
</header>

<main class="flex-grow flex justify-center py-12 px-4 md:px-6">
    <div class="w-full max-w-6xl">
        <div class="text-center mb-10">
            <h1 class="font-cinzel text-3xl md:text-4xl text-muted-gold mb-3">
                <i class="fa-solid fa-satellite-dish mr-2"></i> Universe Telemetry
            </h1>
            <p class="font-sarabun italic text-lg text-ivory/60">ศูนย์ตรวจวัดสภาวะจักรวาลและข่าวกรองสด (Master Deterministic DAG Edition)</p>
        </div>

        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6 pb-3 border-b border-muted-gold/20">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <span class="text-xs font-inter uppercase tracking-widest text-muted-gold/70 shrink-0 hidden sm:inline-block"><i class="fa-solid fa-layer-group mr-1"></i> SELECT SCENE:</span>
                <div class="relative w-full sm:w-auto flex-grow min-w-0">
                    <select id="scene-selector" onchange="loadTelemetry(this.value)" class="appearance-none w-full max-w-full truncate sm:w-[350px] bg-obsidian border border-muted-gold/40 text-ivory text-sm py-2 px-4 pr-10 font-sarabun focus:outline-none focus:border-muted-gold rounded cursor-pointer shadow-[0_0_15px_rgba(197,160,89,0.1)] hover:border-muted-gold/70 transition-colors">
                        <optgroup label="📖 Volume I: Prologue (30 มี.ค. S.1204 - ยูมีร์ดูไบ)">
                            <option value="vol1_prologue_scene01">Scene 01: เช้าตรู่ — สภาอาหารเช้าทองคำแปดแสนล้าน</option>
                            <option value="vol1_prologue_scene02">Scene 02: บ่ายวัน — ลิฟต์แก้วสู่ตึก Burj-Orbal & ดีล 3 แสนล้าน</option>
                            <option value="vol1_prologue_scene03">Scene 03: ค่ำ — สภาส่งตัวรอบค่ำ, วากิวทองคำ & 14 กฎเหล็ก</option>
                            <option value="vol1_prologue_scene04">Scene 04: กลางคืน — ออนเซนทองคำส่องดาว & บทส่งท้าย</option>
                        </optgroup>
                        <optgroup label="🏛️ Volume I: Chapter 01 (31 มี.ค. S.1204 - สู่ทริสต้า)">
                            <option value="vol1_c1_scene01">Scene 01: เช้าตรู่ — บิดหมดปลอก ลั่นมิดไมล์ สู่ซูเปอร์ไฮเวย์</option>
                            <option value="vol1_c1_scene02">Scene 02: สายๆ — พญาเหยี่ยว Hayabusa & แชมป์โลก 500cc</option>
                            <option value="vol1_c1_scene03">Scene 03: สายโด่ง — กองทัพ EV ขวางเลน & เงาไททันทริสต้า</option>
                            <option value="vol1_c1_scene04">Scene 04: เที่ยง — ปะทะคารมขุนนาง & จุดสิ้นสุดบทที่ 1</option>
                        </optgroup>
                        <optgroup label="⚔️ Volume I: Chapter 02 (31 มี.ค. S.1204 - สถาบันทอร์ส)">
                            <option value="vol1_c2_scene01">Scene 01: เที่ยงวัน — พบเฟอร์ริส, ศึกม่านรูด 45 นาที & สูทแดงปฐมนิเทศ</option>
                            <option value="vol1_c2_scene02">Scene 02: เที่ยงวัน — โซฟา VIP หลุดมิติ, กลิ่นสาวซิง & พลุไฟ TitanTron 16K</option>
                            <option value="vol1_c2_scene03">Scene 03: บ่าย — วินซ์เปิดสังเวียน, กลิ่นสาวซิงตกไข่ & DM นู้ดยั่วผัว</option>
                            <option value="vol1_c2_scene04">Scene 04: บ่าย — วินซ์จัดห้องเรียน, มหากาพย์ถางป่า & สาส์นรักเฟอร์ริส</option>
                        </optgroup>
                        <optgroup label="🌲 Volume I: Chapter 03 (31 มี.ค. S.1204 - ป่าหลังสถาบัน, เดียนเบียนฟู & แอลเจียร์)">
                            <option value="vol1_c3_scene01">Scene 01: บ่าย — ผู้นำสายอัลฟ่า, T-800 โดดร่ม & ค่ายกลเดียนเบียนฟู</option>
                            <option value="vol1_c3_scene02">Scene 02: บ่าย — กำเนิดแอลเจียร์ 1950s, โค้ดหลอนเลิฟจัง & ทำเนียบข้าหลวง</option>
                            <option value="vol1_c3_scene03">Scene 03: บ่าย — ระดมพล T-800, เช็กบิลกบฏ FLN & สถาปนาพลเมืองแอลเจียร์</option>
                            <option value="vol1_c3_scene04">Scene 04: ค่ำ — ราตรีแอลเจียร์, ศึกมินิรอยัลรัมเบิล & สาส์นรักใต้ผ้าห่มเฟอร์ริส (Finale)</option>
                        </optgroup>
                        <optgroup label="📚 Volume I: Chapter 04 (1-3 เม.ย. S.1204 - สัปดาห์แรกแห่งการศึกษาบนหลังไททันทริสต้า)">
                            <option value="vol1_c4_scene01">Scene 01: รุ่งอรุณวันจันทร์ — คาบเรียนสองอาจารย์สาว & สัญชาตญาณสัตว์ร้ายใต้หน้ากากผู้นำ</option>
                            <option value="vol1_c4_scene02" selected>Scene 02: อังคาร-พุธ — วาทศิลป์ด่าหน้าไมค์ไฟแลบ, กายกรรม Spinaroonie & จิตวิทยาเก้าอี้เหล็ก Finish the Story</option>
                        </optgroup>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-muted-gold/70">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2 w-full md:w-auto mt-4 md:mt-0">
                <a href="index.html" class="flex-1 md:flex-none px-4 py-2 border border-white/10 bg-white/5 rounded text-ivory/80 text-xs font-cinzel tracking-widest uppercase hover:bg-white/10 transition-colors text-center shadow-sm whitespace-nowrap"><i class="fa-solid fa-home mr-1"></i> หน้าแรก</a>
                <a id="backToStoryBtnTop" href="toc.html" class="flex-1 md:flex-none px-4 py-2 bg-muted-gold/10 border border-muted-gold/50 rounded text-muted-gold text-xs font-cinzel tracking-widest uppercase hover:bg-muted-gold/20 transition-colors shadow-[0_0_10px_rgba(197,160,89,0.1)] text-center whitespace-nowrap"><i class="fa-solid fa-book-open mr-1"></i> กลับเนื้อเรื่อง</a>
            </div>
            <div class="text-xs font-inter text-emerald-400/80 uppercase tracking-widest flex items-center self-end sm:self-center mt-4 md:mt-0">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-2"></span>
                <span>Active Telemetry Matrix</span>
            </div>
        </div>

        <div id="telemetry-content" class="grid grid-cols-1 lg:grid-cols-2 gap-6 opacity-0 transition-opacity duration-300">
            <!-- Rendered dynamically by JS -->
        </div>
    </div>
</main>

<script>
    // 🌌 Real Telemetry Data (Compiled statically from /data/telemetry/*.json)
    const REAL_TELEMETRY_DATA = {};

    function loadTelemetry(sceneId) {
        const container = document.getElementById('telemetry-content');
        
        const backBtnTop = document.getElementById('backToStoryBtnTop');
        if (backBtnTop) backBtnTop.href = 'chapters/' + sceneId + '.html';
        
        container.style.opacity = 0;

        
        setTimeout(() => {
            const data = REAL_TELEMETRY_DATA[sceneId];
            if (data) {
                renderTelemetry(data, sceneId);
                container.style.opacity = 1;
            } else {
                container.innerHTML = `<div class="col-span-2 text-center text-red-400 py-12 font-sarabun bg-white/5 border border-red-500/20 rounded">ไม่พบข้อมูล Telemetry สำหรับฉาก ${sceneId}</div>`;
                container.style.opacity = 1;
            }
        }, 150);
    }

    function renderTelemetry(data, sceneId) {
        const container = document.getElementById('telemetry-content');
        
        let html = '';
        
        // --- MACRO STATE ---
        if (data.macro) {
            html += `
            <div class="col-span-1 lg:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4 mb-2">
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md hover:bg-white/10 transition-colors duration-300">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-regular fa-clock mr-1"></i> World Clock</div>
                    <div class="font-sarabun font-semibold text-ivory text-sm">${data.macro.world_clock}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md hover:bg-white/10 transition-colors duration-300">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-location-dot mr-1"></i> Active Sector</div>
                    <div class="font-sarabun font-semibold text-cyan-200/90 text-sm">${data.macro.active_sector}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md hover:bg-white/10 transition-colors duration-300">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-coins mr-1"></i> Clan Vault</div>
                    <div class="font-sarabun font-semibold text-muted-gold text-sm">${data.macro.clan_vault}</div>
                </div>
                <div class="border border-white/5 bg-white/5 p-4 rounded-sm shadow-md hover:bg-white/10 transition-colors duration-300">
                    <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-1 tracking-wider"><i class="fa-solid fa-bolt mr-1"></i> Rean Spec / PSI</div>
                    <div class="font-sarabun font-semibold text-amber-200/90 text-sm">${data.macro.rean_spec}</div>
                </div>
            </div>`;
        }

        // --- ECONOMY ---
        if (data.economy) {
            const septium = data.economy.septium_price || { value: "-", trend: "-", status: "-", up: true };
            const rfStock = data.economy.rf_stock || { value: "-", trend: "-", status: "-", up: true };
            const landPrice = data.economy.land_price || { value: "-", status: "-" };
            const cashFlow = data.economy.cash_flow || { value: "-", status: "-" };
            const activeDeal = data.economy.active_deal || "-";

            html += `
            <div class="border border-muted-gold/20 bg-obsidian p-6 relative shadow-lg">
                <div class="absolute top-0 left-0 w-8 h-8 border-t border-l border-muted-gold/40"></div>
                <h2 class="font-cinzel text-xl text-muted-gold mb-5 border-b border-white/10 pb-2"><i class="fa-solid fa-chart-line mr-2 text-emerald-400"></i>Capital & Energy</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-white/5 p-3 rounded border border-white/5">
                        <div class="text-[10px] font-inter uppercase text-ivory/40">🛢️ Liquid Septium</div>
                        <div class="font-sarabun font-bold text-2xl text-cyan-300">${septium.value}</div>
                        <div class="text-[10px] font-inter ${septium.up ? 'text-emerald-400' : 'text-red-400'}"><i class="fa-solid ${septium.up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'}"></i> ${septium.trend} ${septium.status}</div>
                    </div>
                    <div class="bg-white/5 p-3 rounded border border-white/5">
                        <div class="text-[10px] font-inter uppercase text-ivory/40">🏢 Reinford / Orbal Index</div>
                        <div class="font-sarabun font-bold text-2xl text-amber-300">${rfStock.value}</div>
                        <div class="text-[10px] font-inter ${rfStock.up ? 'text-emerald-400' : 'text-red-400'}"><i class="fa-solid ${rfStock.up ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down'}"></i> ${rfStock.trend} ${rfStock.status}</div>
                    </div>
                </div>
                <div class="space-y-3 font-sarabun text-ivory/80 text-sm border-t border-white/10 pt-4">
                    <div class="flex justify-between items-center"><span class="text-ivory/50"><i class="fa-solid fa-mountain-sun mr-1"></i> Land Price:</span> <span>${landPrice.value} <span class="text-xs text-amber-200/70 ml-1">(${landPrice.status})</span></span></div>
                    <div class="flex justify-between items-center"><span class="text-ivory/50"><i class="fa-solid fa-wallet mr-1"></i> Cash Flow:</span> <span class="text-emerald-400 font-bold">${cashFlow.value} <span class="text-xs text-emerald-300/70 ml-1 font-normal">(${cashFlow.status})</span></span></div>
                    <div class="mt-4 p-3 bg-white/5 border border-muted-gold/20 rounded-sm">
                        <div class="text-[10px] font-inter uppercase text-muted-gold/60 mb-2">📜 Active Deals & Contracts</div>
                        <div class="italic text-amber-100/90 leading-relaxed font-sarabun text-xs">${activeDeal.replace(/\n/g, '<br>')}</div>
                    </div>
                </div>
            </div>`;
        }

        // --- TENSION ---
        if (data.tension) {
            let tensionColor = 'bg-emerald-500';
            if (data.tension.index_percent > 50) tensionColor = 'bg-amber-500';
            if (data.tension.index_percent > 60) tensionColor = 'bg-red-500';

            html += `
            <div class="border border-muted-gold/20 bg-obsidian p-6 relative shadow-lg">
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-muted-gold/40"></div>
                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-5">
                    <h2 class="font-cinzel text-xl text-muted-gold"><i class="fa-solid fa-shield-halved mr-2 text-red-400"></i>Tension Radar</h2>
                    <span class="text-[10px] font-inter uppercase px-2 py-1 bg-amber-950/80 text-amber-300 border border-amber-500/30 rounded">${data.tension.level_text}</span>
                </div>
                
                <div class="mb-6 bg-white/5 p-4 rounded border border-white/5">
                    <div class="flex justify-between text-[11px] font-inter text-ivory/60 mb-2">
                        <span class="uppercase">Imperial Tension Index</span>
                        <span class="text-amber-300 font-bold">${data.tension.index_percent}%</span>
                    </div>
                    <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden border border-white/10">
                        <div class="h-full ${tensionColor} transition-all duration-1000 shadow-[0_0_10px_currentColor]" style="width: ${data.tension.index_percent}%"></div>
                    </div>
                </div>

                <div class="space-y-3 font-sarabun text-[13px]">
                    <div class="p-3 border-l-2 border-amber-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-amber-500/80 mb-1 flex items-center"><i class="fa-solid fa-crown mr-1"></i> Noble Alliance</div>
                        <div class="text-ivory/80">${data.tension.noble_status}</div>
                    </div>
                    <div class="p-3 border-l-2 border-cyan-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-cyan-500/80 mb-1 flex items-center"><i class="fa-solid fa-building-columns mr-1"></i> Reformist Faction</div>
                        <div class="text-ivory/80">${data.tension.reformist_status}</div>
                    </div>
                    <div class="p-3 border-l-2 border-emerald-500/50 bg-white/5">
                        <div class="text-[10px] font-inter uppercase text-emerald-500/80 mb-1 flex items-center"><i class="fa-solid fa-shield-virus mr-1"></i> Security & Guards</div>
                        <div class="text-ivory/80">${data.tension.guard_status}</div>
                    </div>
                </div>
            </div>`;
        }

        // --- SOCIAL & WIRE ---
        if (data.social) {
            html += `
            <div class="col-span-1 lg:col-span-2 border border-muted-gold/20 bg-obsidian p-6 mt-2 relative shadow-lg">
                <h2 class="font-cinzel text-xl text-muted-gold mb-5 border-b border-white/10 pb-2"><i class="fa-solid fa-hashtag mr-2 text-cyan-400"></i>ARC-Net & Intelligence</h2>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <div class="text-[10px] font-inter uppercase text-ivory/40 mb-3 tracking-widest"><i class="fa-solid fa-fire mr-1 text-red-400"></i> Trending on ARC-Net & SPARC-X</div>
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${data.social.trending_tags.map(t => `<span class="px-2 py-1 bg-[#1F2428] border border-cyan-500/30 text-cyan-300 text-xs font-inter rounded hover:border-cyan-400 cursor-pointer transition-colors shadow-sm">${t}</span>`).join('')}
                        </div>
                        <div class="space-y-3 max-h-[300px] overflow-y-auto pr-2 overscroll-contain custom-scrollbar">
                            ${data.social.posts.map(p => `
                            <div class="p-4 bg-[#0F1318] border border-cyan-900/30 hover:border-cyan-500/30 rounded-lg transition-colors">
                                <div class="flex justify-between items-center mb-2 border-b border-white/5 pb-2">
                                    <span class="font-inter font-bold text-[11px] text-cyan-300 flex items-center"><div class="w-5 h-5 rounded-full bg-cyan-950 flex items-center justify-center mr-2"><i class="fa-solid fa-user text-[8px]"></i></div> ${p.user} <i class="fa-solid fa-circle-check text-cyan-400 ml-1 text-[10px]"></i></span>
                                    <span class="font-inter text-[10px] text-slate-400">${p.time}</span>
                                </div>
                                <div class="font-sarabun text-sm text-ivory/90 mb-3 leading-relaxed">${p.content}</div>
                                <div class="font-inter text-[10px] text-slate-400 flex gap-4">
                                    <span class="cursor-pointer hover:text-red-400"><i class="fa-solid fa-heart text-slate-500 hover:text-red-500 mr-1"></i> ${p.likes}</span>
                                    <span class="cursor-pointer hover:text-cyan-400"><i class="fa-solid fa-retweet text-slate-500 mr-1"></i> RE-ARC</span>
                                </div>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div>
                        <div class="text-[10px] font-inter uppercase text-ivory/40 mb-3 tracking-widest"><i class="fa-solid fa-tower-cell mr-1 text-amber-400"></i> Wire Reports</div>
                        <div class="font-sarabun text-amber-100/90 text-sm mb-4 bg-[#14171A] p-3 border-l-2 border-amber-500 rounded-r-lg shadow-sm">
                            ${data.social.wire_headline}
                        </div>
                        <div class="space-y-2 font-sarabun text-ivory/70 text-sm bg-obsidian border border-white/5 rounded-lg p-2">
                            ${data.social.wire_reports.map(r => `
                            <div class="p-2 border-l-2 border-muted-gold/40 bg-white/5 mb-2 rounded-r flex items-start">
                                <i class="fa-solid fa-caret-right text-muted-gold/50 mr-2 mt-1 text-[10px]"></i>
                                <span class="font-sarabun text-xs leading-relaxed text-slate-300">${r}</span>
                            </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>`;
        }

        
        // --- BOTTOM NAVIGATION ---
        html += `
        <div class="col-span-1 lg:col-span-2 flex flex-wrap justify-center gap-4 mt-8 pb-8">
            <a href="index.html" class="px-6 py-3 border border-white/10 bg-white/5 rounded text-ivory/80 text-sm font-cinzel tracking-widest uppercase hover:bg-white/10 transition-colors shadow-sm"><i class="fa-solid fa-home mr-2"></i> หน้าแรก</a>
            <a href="chapters/${data.scene_id || sceneId}.html" class="px-6 py-3 bg-muted-gold/10 border border-muted-gold/50 rounded text-muted-gold text-sm font-cinzel tracking-widest uppercase hover:bg-muted-gold/20 transition-colors shadow-[0_0_10px_rgba(197,160,89,0.1)]"><i class="fa-solid fa-book-open mr-2"></i> กลับเนื้อเรื่อง</a>
        </div>`;

        container.innerHTML = html;

    }

    // Auto-load scene from URL parameter or default
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const selector = document.getElementById('scene-selector');
        const defaultScene = (selector && selector.value) ? selector.value : 'vol1_c3_scene01';
        const sceneId = urlParams.get('scene') || defaultScene;
        if (selector) {
            selector.value = sceneId;
        }
        loadTelemetry(sceneId);
    });
