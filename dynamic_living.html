    let currentChapter = "vol1_prologue";
    let currentTab = "morning";
    
    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        let urlChapter = urlParams.get('chapter');
        const urlScene = urlParams.get('scene');
        
        // Auto-map scene to chapter
        if (!urlChapter && urlScene) {
            if (urlScene.includes('prologue')) urlChapter = 'vol1_prologue';
            else if (urlScene.includes('c1')) urlChapter = 'vol1_c1';
            else if (urlScene.includes('c2')) urlChapter = 'vol1_c2';
            else if (urlScene.includes('c3')) urlChapter = 'vol1_c3';
            else if (urlScene.includes('c4')) urlChapter = 'vol1_c4';
        }
        
        if (urlChapter && DYNAMIC_LIVING_DATA[urlChapter]) {
            currentChapter = urlChapter;
        } else {
            const keys = Object.keys(DYNAMIC_LIVING_DATA);
            if(keys.length > 0) currentChapter = keys[0];
        }
        
        const dlBack = document.getElementById('backToStoryBtnDL');
        if (dlBack) {
            if (urlScene) {
                dlBack.href = 'chapters/' + urlScene + '.html';
            } else if (currentChapter) {
                dlBack.href = 'chapters/' + currentChapter + '_scene01.html';
            }
        }
        // Save dlBack globally so populateDropdown can use it
        window.dlBack = dlBack;
        
        populateDropdown();
        renderPage();
    }
    
    function populateDropdown() {
        const select = document.getElementById('chapterSelect');
        select.innerHTML = '';
        
        // Define all chapters in order based on Master Outline
        const allChapters = [
            { id: 'vol1_prologue', name: 'Prologue: ปฐมกาลแห่งเลิฟจัง & มหาคำทำนาย HERO OF YEET' },
            { id: 'vol1_c1', name: 'Chapter 1: การเดินทางสู่ทริสต้า & จุดเริ่มต้นแห่ง Class VII' },
            { id: 'vol1_c2', name: 'Chapter 2: พิธีปฐมนิเทศ Thors & มหากาพย์เนรเทศสู่ป่าหลังโรงเรียน' },
            { id: 'vol1_c3', name: 'Chapter 3: ยุทธการบุกเบิกพงไพร และกองพันพลร่มพันธุ์ดุแห่งเดียนเบียนฟู' },
            { id: 'vol1_c4', name: 'Chapter 4: สัปดาห์แรกแห่งการศึกษาบนหลังไททันทริสต้า' }
        ];
        
        allChapters.forEach(ch => {
            const opt = document.createElement('option');
            opt.value = ch.id;
            
            if (DYNAMIC_LIVING_DATA[ch.id]) {
                opt.textContent = DYNAMIC_LIVING_DATA[ch.id].title || ch.name;
            } else {
                opt.textContent = ch.name + " (Locked)";
                opt.disabled = true;
            }
            
            if (ch.id === currentChapter) opt.selected = true;
            select.appendChild(opt);
        });
        
        select.addEventListener('change', (e) => {
            currentChapter = e.target.value;
            currentTab = 'morning'; // reset to morning
            if (window.dlBack) window.dlBack.href = 'chapters/' + currentChapter + '_scene01.html';
            // update URL silently
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('chapter', currentChapter);
            window.history.pushState({}, '', newUrl);
            renderPage();
        });
    }
    
    function setTab(tabName) {
        currentTab = tabName;
        renderPage();
    }
    
    function getInitials(name) {
        if(!name) return "??";
        return name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
    }
    
    function getBorderColor(status) {
        if(!status) return "border-muted-gold/20";
        if(status.includes("FATHER") || status.includes("MOTHER")) return "border-blue-500/50";
        if(status.includes("IMOUTO") || status.includes("QC") || status.includes("BONDING")) return "border-pink-500/50";
        if(status.includes("COSMIC")) return "border-cyan-500/50";
        if(status.includes("SEX") || status.includes("VIP")) return "border-fuchsia-500/50";
        if(status.includes("NEW") || status.includes("FIRST")) return "border-emerald-500/50";
        return "border-muted-gold/20"; // KNOWN or default
    }

    function getBgColor(status) {
        if(!status) return "bg-white/5";
        if(status.includes("FATHER") || status.includes("MOTHER")) return "bg-blue-900/40";
        if(status.includes("IMOUTO") || status.includes("QC") || status.includes("BONDING")) return "bg-pink-900/40";
        if(status.includes("COSMIC")) return "bg-cyan-900/40";
        if(status.includes("SEX") || status.includes("VIP")) return "bg-fuchsia-900/40";
        if(status.includes("NEW") || status.includes("FIRST")) return "bg-emerald-900/40";
        return "bg-white/5"; // KNOWN or default
    }

                            </div>
                        </div>
                        <p class="text-sm text-ivory/80 mb-4 pb-4 border-b border-muted-gold/10 leading-relaxed font-sarabun">
                            ${card.activity}
                        </p>
                        ${card.dialog ? `
                        <blockquote class="text-sm italic text-ivory/60 border-l-2 border-muted-gold/40 pl-3 mb-3 leading-relaxed font-sarabun">
                            "${card.dialog}"
                        </blockquote>` : ''}
                        ${card.hook_desc ? `
                        <div class="text-[11px] text-muted-gold/70 mt-auto pt-2 font-inter tracking-wide">
                            <span class="font-semibold text-muted-gold">EVENT:</span> ${card.hook_desc}
                        </div>` : ''}
                    </div>
                </div>`;
            });
            html += `</div>`;
        } else {
            html += `
            <div class="text-center p-12 text-ivory/40 border border-muted-gold/20 border-dashed rounded-sm animate-fade-in bg-white/5 font-sarabun text-sm">
                ไม่มีข้อมูลกิจกรรมในเวลานี้
            </div>`;
        }
        
        // --- BOTTOM NAVIGATION ---
        let bottomLink = 'chapters/' + currentChapter + '_scene01.html';
        if (window.dlBack && window.dlBack.href) bottomLink = window.dlBack.href;
        
        html += `
        <div class="col-span-1 md:col-span-2 flex flex-wrap justify-center gap-4 mt-16 pb-8 font-inter text-[10px] uppercase tracking-widest">
            <a href="index.html" class="px-6 py-3 border border-muted-gold/20 bg-white/5 text-ivory/70 hover:bg-muted-gold/10 hover:text-muted-gold transition-colors text-center shadow-sm"><i class="fa-solid fa-home mr-2"></i> หน้าแรก</a>
            <a href="${bottomLink}" class="px-6 py-3 border border-muted-gold/40 bg-muted-gold/10 text-muted-gold hover:bg-muted-gold/20 transition-colors text-center shadow-[0_0_10px_rgba(212,175,55,0.1)]"><i class="fa-solid fa-book-open mr-2"></i> กลับเนื้อเรื่อง</a>
        </div>`;
        
        contentDiv.innerHTML = html;
    }
    
    document.addEventListener('DOMContentLoaded', init);
</script>

</head>
