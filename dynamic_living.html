<body class="bg-obsidian text-ivory antialiased min-h-screen flex flex-col font-cormorant selection:bg-muted-gold/30 selection:text-ivory">
    
<!-- Navbar Extension -->
<div class="bg-slate-900/90 border-b border-slate-700 p-4 sticky top-16 z-40 backdrop-blur-md">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-xl font-bold text-amber-400 flex items-center">
            🗺️ Dynamic Living Matrix

<main id="mainContent" class="max-w-6xl mx-auto mt-6 mb-12 px-4 font-sarabun">
