    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        let targetScene = urlParams.get('scene');
        
        const selector = document.getElementById('scene-selector');
        const scenes = Object.keys(TELEMETRY);
        
        scenes.forEach(sceneId => {
            const snap = TELEMETRY[sceneId];
            if (snap) {
                const opt = document.createElement('option');
                opt.value = sceneId;
                opt.textContent = snap.world_clock ? snap.world_clock.split('(')[0].trim() + ` [${sceneId}]` : sceneId;
                selector.appendChild(opt);
            }
        });
        
        if (targetScene && TELEMETRY[targetScene]) {
            selector.value = targetScene;
        } else if (scenes.length > 0) {
            selector.value = scenes[0]; // fallback to first
        }
        
        selector.addEventListener('change', (e) => {
            renderIntel(e.target.value);
        });
        
        if (selector.value) {
            renderIntel(selector.value);
        }
    });
    
    function renderIntel(sceneId) {
        const snap = TELEMETRY[sceneId];
        if (!snap) return;
        
        document.getElementById('intel-time').textContent = snap.world_clock || 'UNKNOWN TIME';
        document.getElementById('map-weather').textContent = snap.temp_ambient || 'UNKNOWN WEATHER';
        
        const panel = document.getElementById('intel-panel');
        if (snap.active_operatives && snap.active_operatives.length > 0) {
            panel.innerHTML = snap.active_operatives.map(op => {
                let icon = "👤";
                let borderColor = "border-gray-500/30";
                let textColor = "text-ivory";
                let bg = "bg-obsidian";
                
                if (op.id.includes("rean")) { icon = "👑"; borderColor = "border-red-500/50"; textColor = "text-red-400"; bg = "bg-red-950/20"; }
                else if (op.id.includes("elise")) { icon = "🌸"; borderColor = "border-pink-500/50"; textColor = "text-pink-400"; bg = "bg-pink-950/20"; }
                else if (op.id.includes("serpico")) { icon = "🏍️"; borderColor = "border-emerald-500/50"; textColor = "text-emerald-400"; bg = "bg-emerald-950/20"; }
                else if (op.id.includes("teo")) { icon = "💰"; borderColor = "border-amber-500/50"; textColor = "text-amber-400"; bg = "bg-amber-950/20"; }
                else if (op.id.includes("lucia")) { icon = "💼"; borderColor = "border-purple-500/50"; textColor = "text-purple-400"; bg = "bg-purple-950/20"; }
                else if (op.id.includes("maid") || op.id.includes("ella") || op.id.includes("frey")) { icon = "🧹"; borderColor = "border-blue-500/50"; textColor = "text-blue-400"; bg = "bg-blue-950/20"; }
                
                return `

                            <div>

                        </div>
                        <div class="text-[10px] text-ivory/80 leading-relaxed border-t border-white/5 pt-2">

                        </div>

            }).join('');
        } else {
